# Supplier disruption local stack: the app image (web, API and worker under
# s6) and a separate PostgreSQL. The database publishes no host port here.
#
#   docker compose build app
#   docker compose run --rm init        # migrations and fixture seed, once per change
#   docker compose up --detach --wait app
#
# SD_APP_HOST_PORT (default 3102) and SD_APP_IMAGE exist so the container tests
# can run disposable projects beside this one; leave them unset otherwise.
name: supplier-disruption

x-app-image: &app-image
  image: ${SD_APP_IMAGE:-supplier-disruption-app:local}
  build:
    context: .
    args:
      BUILD_REVISION: ${SD_BUILD_REVISION:-local}

# Applied to every container started from the app image.
x-hardened: &hardened
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    # postgres:18.6-bookworm, multi-platform index digest resolved 2026-10-18.
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_DB: supplier_disruption
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - db_migrator_password
      - db_api_password
      - db_worker_password
    volumes:
      # PostgreSQL 18 images keep PGDATA under this parent (18/docker).
      - db-data:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, so the socket-only server used during initialization never reports healthy.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s

  # Bounded one-off initialization from the same image: migrations, grants,
  # schema tag and the synthetic fixture seed. The only service that mounts the
  # migrator URL and the fixture passwords. Run: docker compose run --rm init
  init:
    <<: [*app-image, *hardened]
    profiles: [init]
    entrypoint: ["/opt/sd/bin/init-db"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ID: supplier-disruption
      APP_ORIGIN: http://127.0.0.1:${SD_APP_HOST_PORT:-3102}
      DATABASE_URL_MIGRATOR_FILE: /run/secrets/database_url_migrator
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      FIXTURE_BUYER_PASSWORD_FILE: /run/secrets/fixture_buyer_password
      FIXTURE_MANAGER_PASSWORD_FILE: /run/secrets/fixture_manager_password
    secrets:
      - source: container_database_url_migrator
        target: database_url_migrator
      - better_auth_secret
      - fixture_buyer_password
      - fixture_manager_password

  app:
    <<: [*app-image, *hardened]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Only the web server is published. The API listens on 127.0.0.1:3001 inside.
    ports:
      - "127.0.0.1:${SD_APP_HOST_PORT:-3102}:3000"
    # The only writable paths. s6 needs /run owned by the container user and executable.
    tmpfs:
      - /run:uid=10001,gid=10001,mode=0755,exec,size=16m
      - /tmp:uid=10001,gid=10001,mode=1777,noexec,nosuid,size=64m
    environment:
      APP_ID: supplier-disruption
      APP_ORIGIN: http://127.0.0.1:${SD_APP_HOST_PORT:-3102}
      DATA_MODE: fixture
      AGENT_MODE: rules
      AUTH_MODE: fixture
      LOG_LEVEL: info
      DATABASE_URL_API_FILE: /run/secrets/database_url_api
      DATABASE_URL_WORKER_FILE: /run/secrets/database_url_worker
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      WORKER_SERVICE_TOKEN_FILE: /run/secrets/worker_service_token
    secrets:
      - source: container_database_url_api
        target: database_url_api
      - source: container_database_url_worker
        target: database_url_worker
      - better_auth_secret
      - worker_service_token
    # Aggregate readiness on loopback: API ready, web answering and a fresh
    # worker heartbeat from this boot. Never reachable through the published port.
    healthcheck:
      test: ["CMD", "/opt/sd/bin/healthcheck.mjs"]
      interval: 2s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 1s
    # The image drains in under 30 s; this leaves room before Docker's SIGKILL.
    stop_grace_period: 60s

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  db_migrator_password:
    file: ./.secrets/db_migrator_password
  db_api_password:
    file: ./.secrets/db_api_password
  db_worker_password:
    file: ./.secrets/db_worker_password
  container_database_url_migrator:
    file: ./.secrets/container/database_url_migrator
  container_database_url_api:
    file: ./.secrets/container/database_url_api
  container_database_url_worker:
    file: ./.secrets/container/database_url_worker
  better_auth_secret:
    file: ./.secrets/better_auth_secret
  worker_service_token:
    file: ./.secrets/worker_service_token
  fixture_buyer_password:
    file: ./.secrets/fixture_buyer_password
  fixture_manager_password:
    file: ./.secrets/fixture_manager_password

volumes:
  db-data:
