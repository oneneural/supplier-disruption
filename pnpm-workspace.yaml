  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  better-auth: 1.7.10
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.13.0
  eslint-plugin-react-hooks: 7.1.1
  fastify: 5.12.7
  globals: 17.13.0
